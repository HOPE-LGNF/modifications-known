name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ModificationsKnown.sln

      - name: Build
        run: dotnet build ModificationsKnown.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ModificationsKnown.sln --configuration Release --no-build

      - name: Publish (Windows x64)
        run: >
          dotnet publish src/ModificationsKnown.App/ModificationsKnown.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output artifacts/win-x64
